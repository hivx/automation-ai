# TODO(v2): GitLab equivalent of team-ci.yml. For now only a skeleton; onboard copies it when ci.provider = gitlab.
stages: [check]

team-check:
  stage: check
  image: ubuntu:24.04
  timeout: 30m
  script:
    - {{ci.setup|lines:4}}
    - {{cmd.lint|or:true}}
    - {{cmd.typecheck|or:true}}
    - {{cmd.test|or:true}}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "{{base_branch|or:main}}"
