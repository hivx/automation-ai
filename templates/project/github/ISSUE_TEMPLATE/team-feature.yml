name: Yêu cầu cho đội team
description: Giao một yêu cầu thô cho đội. Gắn nhãn team:intake để đội nhận.
labels: ["team:intake"]
body:
  - type: textarea
    id: request
    attributes:
      label: Yêu cầu thô
      description: Viết như nói với đồng nghiệp. Đội sẽ hỏi lại điều lớn chưa rõ.
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Cỡ việc
      options: ["auto", "S", "M", "L"]
      default: 0
  - type: dropdown
    id: mode
    attributes:
      label: Chế độ
      description: ask = hỏi điều lớn chưa rõ; decide = tự quyết và ghi lý do (thêm nhãn team:ask để hỏi).
      options: ["decide", "ask"]
      default: 0
  - type: textarea
    id: constraints
    attributes:
      label: Ràng buộc
      description: Hạn, công nghệ bắt buộc, phần không được đụng.
  - type: textarea
    id: done
    attributes:
      label: Thế nào là xong
      description: Điều bạn sẽ kiểm để chấp nhận.
