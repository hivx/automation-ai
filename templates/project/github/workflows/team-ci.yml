# Generated by /team:onboard or /team:ci setup from the profile (ci.*, cmd.*). Do not edit by hand: change the profile and regenerate, or add a step with /team:ci add-stage (separate PR).
name: team-ci

on:
  pull_request:
  push:
    branches: ["{{base_branch|or:main}}"]

concurrency:
  group: team-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: {{ci.runner|or:ubuntu-latest}}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          {{ci.setup|lines:10}}
      - name: Lint
        run: {{cmd.lint|or:echo "::warning::cmd.lint is not configured in .team/profile.json — this step checks nothing"}}
      - name: Typecheck
        run: {{cmd.typecheck|or:echo "::warning::cmd.typecheck is not configured in .team/profile.json — this step checks nothing"}}
      - name: Test
        run: {{cmd.test|or:echo "::warning::cmd.test is not configured in .team/profile.json — this step checks nothing"}}
      - name: Build
        run: {{cmd.build|or:echo "::warning::cmd.build is not configured in .team/profile.json — this step checks nothing"}}
