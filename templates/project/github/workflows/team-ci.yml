# Do /team:onboard hoặc /team:ci setup sinh từ profile (ci.*, cmd.*). Không sửa tay: đổi profile rồi sinh lại, hoặc thêm bước bằng /team:ci add-stage (PR riêng).
name: team-ci

on:
  pull_request:
  push:
    branches: ["{{base_branch|or:main}}"]

concurrency:
  group: team-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: {{ci.runner|or:ubuntu-latest}}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          {{ci.setup|lines:10}}
      - name: Lint
        run: {{cmd.lint|or:echo "::warning::cmd.lint chưa cấu hình trong .team/profile.json — bước này không kiểm gì"}}
      - name: Typecheck
        run: {{cmd.typecheck|or:echo "::warning::cmd.typecheck chưa cấu hình trong .team/profile.json — bước này không kiểm gì"}}
      - name: Test
        run: {{cmd.test|or:echo "::warning::cmd.test chưa cấu hình trong .team/profile.json — bước này không kiểm gì"}}
      - name: Build
        run: {{cmd.build|or:echo "::warning::cmd.build chưa cấu hình trong .team/profile.json — bước này không kiểm gì"}}
